<svg viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="1280" height="800" fill="#1e2320"/>

  <!-- top bar -->
  <text x="32" y="40" fill="#e6e4dc" font-size="20" font-weight="600">Operating Spend — FY25</text>
  <text x="290" y="40" fill="#98a29a" font-size="13">Retirement living group</text>
  <text x="1050" y="40" fill="#e6e4dc" font-size="13" font-weight="600">Overview</text>
  <rect x="1050" y="48" width="58" height="2" fill="#8a9c28"/>
  <text x="1130" y="40" fill="#98a29a" font-size="13">Detail</text>
  <text x="1190" y="40" fill="#98a29a" font-size="13">Sites</text>

  <!-- slicer row -->
  <g font-size="12">
    <rect x="32" y="66" width="120" height="30" rx="15" fill="#242a26" stroke="#343b36"/>
    <text x="48" y="85" fill="#e6e4dc">Year: FY25</text><text x="128" y="85" fill="#98a29a">▾</text>
    <rect x="164" y="66" width="130" height="30" rx="15" fill="#242a26" stroke="#343b36"/>
    <text x="180" y="85" fill="#e6e4dc">Region: All</text><text x="270" y="85" fill="#98a29a">▾</text>
    <rect x="306" y="66" width="130" height="30" rx="15" fill="#242a26" stroke="#343b36"/>
    <text x="322" y="85" fill="#e6e4dc">Category: All</text><text x="412" y="85" fill="#98a29a">▾</text>
  </g>

  <!-- KPI tiles -->
  <g>
    <rect x="32" y="120" width="292" height="100" rx="12" fill="#242a26" stroke="#2c332e"/>
    <text x="56" y="152" fill="#98a29a" font-size="12" letter-spacing="1">TOTAL SPEND</text>
    <text x="56" y="190" fill="#e6e4dc" font-size="30" font-weight="600">£86.4M</text>
    <text x="56" y="210" fill="#98a29a" font-size="12">▲ 3.1% vs FY24</text>

    <rect x="340" y="120" width="292" height="100" rx="12" fill="#242a26" stroke="#2c332e"/>
    <text x="364" y="152" fill="#98a29a" font-size="12" letter-spacing="1">CARE STAFFING SHARE</text>
    <text x="364" y="190" fill="#e6e4dc" font-size="30" font-weight="600">36%</text>
    <text x="364" y="210" fill="#98a29a" font-size="12">largest spend area</text>

    <rect x="648" y="120" width="292" height="100" rx="12" fill="#242a26" stroke="#2c332e"/>
    <text x="672" y="152" fill="#98a29a" font-size="12" letter-spacing="1">COST PER RESIDENT</text>
    <text x="672" y="190" fill="#e6e4dc" font-size="30" font-weight="600">£2,140 <tspan font-size="15" fill="#98a29a">/ month</tspan></text>
    <text x="672" y="210" fill="#98a29a" font-size="12">▼ 1.4% vs FY24</text>

    <rect x="956" y="120" width="292" height="100" rx="12" fill="#242a26" stroke="#2c332e"/>
    <text x="980" y="152" fill="#98a29a" font-size="12" letter-spacing="1">VILLAGES</text>
    <text x="980" y="190" fill="#e6e4dc" font-size="30" font-weight="600">38</text>
    <text x="980" y="210" fill="#98a29a" font-size="12">4,020 residents</text>
  </g>

  <!-- horizontal bars: spend by area -->
  <rect x="32" y="244" width="608" height="296" rx="12" fill="#242a26" stroke="#2c332e"/>
  <text x="56" y="278" fill="#e6e4dc" font-size="14" font-weight="600">Spend by area <tspan fill="#98a29a" font-weight="400">· £M</tspan></text>
  <g font-size="12">
    <text x="56" y="316" fill="#e6e4dc">Care staffing</text>
    <text x="56" y="348" fill="#e6e4dc">Catering</text>
    <text x="56" y="380" fill="#98a29a">Other</text>
    <text x="56" y="412" fill="#98a29a">Utilities</text>
    <text x="56" y="444" fill="#98a29a">Maintenance</text>
    <text x="56" y="476" fill="#98a29a">Insurance</text>
    <text x="56" y="508" fill="#98a29a">Admin</text>
  </g>
  <!-- bars start x=180, scale 12.18px per £1M (max 31.2 → 380) -->
  <g>
    <path d="M180,305 L556,305 Q560,305 560,309 L560,315 Q560,319 556,319 L180,319 Z" fill="#8a9c28"/>
    <path d="M180,337 L354,337 Q358,337 358,341 L358,347 Q358,351 354,351 L180,351 Z" fill="#8a9c28"/>
    <path d="M180,369 L304,369 Q308,369 308,373 L308,379 Q308,383 304,383 L180,383 Z" fill="#4a544e"/>
    <path d="M180,401 L295,401 Q299,401 299,405 L299,411 Q299,415 295,415 L180,415 Z" fill="#4a544e"/>
    <path d="M180,433 L275,433 Q279,433 279,437 L279,443 Q279,447 275,447 L180,447 Z" fill="#4a544e"/>
    <path d="M180,465 L253,465 Q257,465 257,469 L257,475 Q257,479 253,479 L180,479 Z" fill="#4a544e"/>
    <path d="M180,497 L248,497 Q252,497 252,501 L252,507 Q252,511 248,511 L180,511 Z" fill="#4a544e"/>
  </g>
  <g font-size="11" fill="#98a29a">
    <text x="570" y="316" fill="#e6e4dc" font-weight="600">31.2</text>
    <text x="368" y="348" fill="#e6e4dc" font-weight="600">14.6</text>
    <text x="318" y="380">10.5</text>
    <text x="309" y="412">9.8</text>
    <text x="289" y="444">8.1</text>
    <text x="267" y="476">6.3</text>
    <text x="262" y="508">5.9</text>
  </g>

  <!-- line chart: monthly spend vs budget -->
  <rect x="656" y="244" width="592" height="296" rx="12" fill="#242a26" stroke="#2c332e"/>
  <text x="680" y="278" fill="#e6e4dc" font-size="14" font-weight="600">Monthly spend vs budget <tspan fill="#98a29a" font-weight="400">· £M</tspan></text>
  <g font-size="11">
    <circle cx="1070" cy="274" r="4" fill="#8a9c28"/><text x="1080" y="278" fill="#e6e4dc">Actual</text>
    <line x1="1140" y1="274" x2="1156" y2="274" stroke="#8b948d" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="1162" y="278" fill="#e6e4dc">Budget</text>
  </g>
  <g stroke="#e6e4dc" stroke-opacity="0.07">
    <line x1="700" y1="500" x2="1216" y2="500"/>
    <line x1="700" y1="448.8" x2="1216" y2="448.8"/>
    <line x1="700" y1="389.4" x2="1216" y2="389.4"/>
    <line x1="700" y1="330" x2="1216" y2="330"/>
  </g>
  <g fill="#98a29a" font-size="10" text-anchor="end">
    <text x="694" y="504">6.5</text>
    <text x="694" y="452.8">7.0</text>
    <text x="694" y="393.4">7.5</text>
    <text x="694" y="334">8.0</text>
  </g>
  <!-- budget reference (dashed) -->
  <line x1="700" y1="425" x2="1217" y2="425" stroke="#8b948d" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- actual (olive) -->
  <polyline fill="none" stroke="#8a9c28" stroke-width="2" stroke-linejoin="round"
    points="700,460.6 747,448.8 794,401.3 841,436.9 888,425 935,389.4 982,413.1 1029,377.5 1076,425 1123,401.3 1170,365.6 1217,436.9"/>
  <g fill="#98a29a" font-size="10" text-anchor="middle">
    <text x="700" y="520">Jul</text><text x="794" y="520">Sep</text><text x="888" y="520">Nov</text>
    <text x="982" y="520">Jan</text><text x="1076" y="520">Mar</text><text x="1170" y="520">May</text>
  </g>

  <!-- donut: cost structure -->
  <rect x="32" y="564" width="380" height="204" rx="12" fill="#242a26" stroke="#2c332e"/>
  <text x="56" y="598" fill="#e6e4dc" font-size="14" font-weight="600">Cost structure</text>
  <g transform="rotate(-90 128 684)">
    <circle cx="128" cy="684" r="56" fill="none" stroke="#8a9c28" stroke-width="24" stroke-dasharray="200 152"/>
    <circle cx="128" cy="684" r="56" fill="none" stroke="#3a86c8" stroke-width="24" stroke-dasharray="105 247" stroke-dashoffset="-204"/>
    <circle cx="128" cy="684" r="56" fill="none" stroke="#b5622f" stroke-width="24" stroke-dasharray="35 317" stroke-dashoffset="-313"/>
  </g>
  <text x="128" y="682" fill="#e6e4dc" font-size="19" font-weight="600" text-anchor="middle">£86.4M</text>
  <text x="128" y="698" fill="#98a29a" font-size="10" text-anchor="middle">FY25</text>
  <g font-size="12">
    <circle cx="228" cy="650" r="5" fill="#8a9c28"/><text x="240" y="654" fill="#e6e4dc">Staff costs</text><text x="240" y="670" fill="#98a29a">55%</text>
    <circle cx="228" cy="692" r="5" fill="#3a86c8"/><text x="240" y="696" fill="#e6e4dc">Operations</text><text x="240" y="712" fill="#98a29a">29%</text>
    <circle cx="228" cy="734" r="5" fill="#b5622f"/><text x="240" y="738" fill="#e6e4dc">Capital works</text><text x="240" y="754" fill="#98a29a">16%</text>
  </g>

  <!-- stacked quarterly columns -->
  <rect x="428" y="564" width="820" height="204" rx="12" fill="#242a26" stroke="#2c332e"/>
  <text x="452" y="598" fill="#e6e4dc" font-size="14" font-weight="600">Quarterly spend by group <tspan fill="#98a29a" font-weight="400">· £M</tspan></text>
  <g font-size="11">
    <circle cx="1000" cy="594" r="4" fill="#8a9c28"/><text x="1010" y="598" fill="#e6e4dc">Staff</text>
    <circle cx="1060" cy="594" r="4" fill="#3a86c8"/><text x="1070" y="598" fill="#e6e4dc">Catering</text>
    <circle cx="1140" cy="594" r="4" fill="#b5622f"/><text x="1150" y="598" fill="#e6e4dc">Other</text>
  </g>
  <!-- baseline y=744; 2px gaps between segments; scale ~4.58px per £1M -->
  <g>
    <!-- Q1 total 21.0: staff 7.5→34, catering 3.5→16, other 10.0→46 -->
    <rect x="500" y="710" width="64" height="34" fill="#8a9c28"/>
    <rect x="500" y="692" width="64" height="16" fill="#3a86c8"/>
    <path d="M500,690 L500,648 Q500,644 504,644 L560,644 Q564,644 564,648 L564,690 Z" fill="#b5622f"/>
    <!-- Q2 total 21.6 -->
    <rect x="680" y="709" width="64" height="35" fill="#8a9c28"/>
    <rect x="680" y="690.5" width="64" height="16.5" fill="#3a86c8"/>
    <path d="M680,688.5 L680,645.5 Q680,641.5 684,641.5 L740,641.5 Q744,641.5 744,645.5 L744,688.5 Z" fill="#b5622f"/>
    <!-- Q3 total 21.4 -->
    <rect x="860" y="709" width="64" height="35" fill="#8a9c28"/>
    <rect x="860" y="690.5" width="64" height="16.5" fill="#3a86c8"/>
    <path d="M860,688.5 L860,646.5 Q860,642.5 864,642.5 L920,642.5 Q924,642.5 924,646.5 L924,688.5 Z" fill="#b5622f"/>
    <!-- Q4 total 22.4 -->
    <rect x="1040" y="707" width="64" height="37" fill="#8a9c28"/>
    <rect x="1040" y="688" width="64" height="17" fill="#3a86c8"/>
    <path d="M1040,686 L1040,641 Q1040,637 1044,637 L1100,637 Q1104,637 1104,641 L1104,686 Z" fill="#b5622f"/>
  </g>
  <g fill="#e6e4dc" font-size="11" text-anchor="middle">
    <text x="532" y="634" font-weight="600">21.0</text>
    <text x="712" y="631.5" font-weight="600">21.6</text>
    <text x="892" y="632.5" font-weight="600">21.4</text>
    <text x="1072" y="627" font-weight="600">22.4</text>
  </g>
  <g fill="#98a29a" font-size="11" text-anchor="middle">
    <text x="532" y="762">Q1</text>
    <text x="712" y="762">Q2</text>
    <text x="892" y="762">Q3</text>
    <text x="1072" y="762">Q4</text>
  </g>
</svg>
