<svg viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <!-- surface -->
  <rect width="1280" height="800" fill="#1e2320"/>

  <!-- top bar: report title + tabs -->
  <text x="32" y="40" fill="#e6e4dc" font-size="20" font-weight="600">Group Emissions — FY25</text>
  <text x="300" y="40" fill="#98a29a" font-size="13">Leisure &amp; hospitality group</text>
  <text x="1050" y="40" fill="#e6e4dc" font-size="13" font-weight="600">Overview</text>
  <rect x="1050" y="48" width="58" height="2" fill="#8a9c28"/>
  <text x="1130" y="40" fill="#98a29a" font-size="13">Trends</text>
  <text x="1196" y="40" fill="#98a29a" font-size="13">Sites</text>

  <!-- slicer row -->
  <g font-size="12">
    <rect x="32" y="66" width="120" height="30" rx="15" fill="#242a26" stroke="#343b36"/>
    <text x="48" y="85" fill="#e6e4dc">Year: FY25</text><text x="128" y="85" fill="#98a29a">▾</text>
    <rect x="164" y="66" width="120" height="30" rx="15" fill="#242a26" stroke="#343b36"/>
    <text x="180" y="85" fill="#e6e4dc">Brand: All</text><text x="260" y="85" fill="#98a29a">▾</text>
    <rect x="296" y="66" width="112" height="30" rx="15" fill="#242a26" stroke="#343b36"/>
    <text x="312" y="85" fill="#e6e4dc">Site: All</text><text x="384" y="85" fill="#98a29a">▾</text>
  </g>

  <!-- KPI tiles -->
  <g>
    <rect x="32" y="120" width="292" height="100" rx="12" fill="#242a26" stroke="#2c332e"/>
    <text x="56" y="152" fill="#98a29a" font-size="12" letter-spacing="1">TOTAL EMISSIONS</text>
    <text x="56" y="190" fill="#e6e4dc" font-size="30" font-weight="600">48,210 <tspan font-size="15" fill="#98a29a">tCO₂e</tspan></text>
    <text x="56" y="210" fill="#98a29a" font-size="12">▼ 6.2% vs FY24</text>

    <rect x="340" y="120" width="292" height="100" rx="12" fill="#242a26" stroke="#2c332e"/>
    <text x="364" y="152" fill="#98a29a" font-size="12" letter-spacing="1">ENERGY SHARE</text>
    <text x="364" y="190" fill="#e6e4dc" font-size="30" font-weight="600">41%</text>
    <text x="364" y="210" fill="#98a29a" font-size="12">largest category</text>

    <rect x="648" y="120" width="292" height="100" rx="12" fill="#242a26" stroke="#2c332e"/>
    <text x="672" y="152" fill="#98a29a" font-size="12" letter-spacing="1">FOOD PROCUREMENT SHARE</text>
    <text x="672" y="190" fill="#e6e4dc" font-size="30" font-weight="600">27%</text>
    <text x="672" y="210" fill="#98a29a" font-size="12">second largest</text>

    <rect x="956" y="120" width="292" height="100" rx="12" fill="#242a26" stroke="#2c332e"/>
    <text x="980" y="152" fill="#98a29a" font-size="12" letter-spacing="1">SITES REPORTING</text>
    <text x="980" y="190" fill="#e6e4dc" font-size="30" font-weight="600">214</text>
    <text x="980" y="210" fill="#98a29a" font-size="12">100% coverage</text>
  </g>

  <!-- bar chart: emissions by category -->
  <rect x="32" y="244" width="608" height="296" rx="12" fill="#242a26" stroke="#2c332e"/>
  <text x="56" y="278" fill="#e6e4dc" font-size="14" font-weight="600">Emissions by category <tspan fill="#98a29a" font-weight="400">· tCO₂e</tspan></text>
  <!-- gridlines -->
  <g stroke="#e6e4dc" stroke-opacity="0.07">
    <line x1="72" y1="500" x2="616" y2="500"/>
    <line x1="72" y1="405" x2="616" y2="405"/>
    <line x1="72" y1="310" x2="616" y2="310"/>
  </g>
  <g fill="#98a29a" font-size="10">
    <text x="66" y="504" text-anchor="end">0</text>
    <text x="66" y="409" text-anchor="end">10k</text>
    <text x="66" y="314" text-anchor="end">20k</text>
  </g>
  <!-- bars: baseline y=500, scale 9.5px per 1000 -->
  <g>
    <path d="M100,500 L100,316 Q100,312 104,312 L148,312 Q152,312 152,316 L152,500 Z" fill="#8a9c28"/>
    <path d="M190,500 L190,379 Q190,375 194,375 L238,375 Q242,375 242,379 L242,500 Z" fill="#8a9c28"/>
    <path d="M280,500 L280,457 Q280,453 284,453 L328,453 Q332,453 332,457 L332,500 Z" fill="#4a544e"/>
    <path d="M370,500 L370,462 Q370,458 374,458 L418,458 Q422,458 422,462 L422,500 Z" fill="#4a544e"/>
    <path d="M460,500 L460,470 Q460,466 464,466 L508,466 Q512,466 512,470 L512,500 Z" fill="#4a544e"/>
    <path d="M550,500 L550,481 Q550,477 554,477 L598,477 Q602,477 602,481 L602,500 Z" fill="#4a544e"/>
  </g>
  <!-- value labels -->
  <g fill="#e6e4dc" font-size="11" text-anchor="middle">
    <text x="126" y="302" font-weight="600">19.8k</text>
    <text x="216" y="365" font-weight="600">13.1k</text>
    <text x="306" y="443" fill="#98a29a">4.9k</text>
    <text x="396" y="448" fill="#98a29a">4.4k</text>
    <text x="486" y="456" fill="#98a29a">3.6k</text>
    <text x="576" y="467" fill="#98a29a">2.4k</text>
  </g>
  <!-- category labels -->
  <g fill="#98a29a" font-size="11" text-anchor="middle">
    <text x="126" y="522" fill="#e6e4dc">Energy</text>
    <text x="216" y="522" fill="#e6e4dc">Food proc.</text>
    <text x="306" y="522">Refrigerants</text>
    <text x="396" y="522">Travel</text>
    <text x="486" y="522">Waste</text>
    <text x="576" y="522">Water</text>
  </g>

  <!-- line chart: monthly trend by brand -->
  <rect x="656" y="244" width="592" height="296" rx="12" fill="#242a26" stroke="#2c332e"/>
  <text x="680" y="278" fill="#e6e4dc" font-size="14" font-weight="600">Monthly emissions by brand <tspan fill="#98a29a" font-weight="400">· tCO₂e</tspan></text>
  <!-- legend -->
  <g font-size="11">
    <circle cx="1080" cy="274" r="4" fill="#8a9c28"/><text x="1090" y="278" fill="#e6e4dc">Clubs</text>
    <circle cx="1150" cy="274" r="4" fill="#3a86c8"/><text x="1160" y="278" fill="#e6e4dc">Hotels</text>
  </g>
  <g stroke="#e6e4dc" stroke-opacity="0.07">
    <line x1="700" y1="500" x2="1216" y2="500"/>
    <line x1="700" y1="443" x2="1216" y2="443"/>
    <line x1="700" y1="386" x2="1216" y2="386"/>
    <line x1="700" y1="329" x2="1216" y2="329"/>
  </g>
  <g fill="#98a29a" font-size="10" text-anchor="end">
    <text x="694" y="504">0</text>
    <text x="694" y="447">1k</text>
    <text x="694" y="390">2k</text>
    <text x="694" y="333">3k</text>
  </g>
  <!-- Clubs (olive): scale y=500-(v/3000*171) -->
  <polyline fill="none" stroke="#8a9c28" stroke-width="2" stroke-linejoin="round"
    points="700,351.8 747,357.5 794,354.7 841,363.2 888,368.9 935,371.8 982,366.1 1029,374.6 1076,377.5 1123,380.3 1170,383.2 1217,387.1"/>
  <!-- Hotels (blue) -->
  <polyline fill="none" stroke="#3a86c8" stroke-width="2" stroke-linejoin="round"
    points="700,414.5 747,415.6 794,413.4 841,417.4 888,420.2 935,421.3 982,419.1 1029,423.1 1076,424.2 1123,425.9 1170,427.0 1217,428.8"/>
  <!-- month labels -->
  <g fill="#98a29a" font-size="10" text-anchor="middle">
    <text x="700" y="520">Jul</text><text x="794" y="520">Sep</text><text x="888" y="520">Nov</text>
    <text x="982" y="520">Jan</text><text x="1076" y="520">Mar</text><text x="1170" y="520">May</text>
  </g>

  <!-- donut: by scope -->
  <rect x="32" y="564" width="380" height="204" rx="12" fill="#242a26" stroke="#2c332e"/>
  <text x="56" y="598" fill="#e6e4dc" font-size="14" font-weight="600">Emissions by scope</text>
  <g transform="rotate(-90 128 684)">
    <circle cx="128" cy="684" r="56" fill="none" stroke="#8a9c28" stroke-width="24" stroke-dasharray="214 138"/>
    <circle cx="128" cy="684" r="56" fill="none" stroke="#3a86c8" stroke-width="24" stroke-dasharray="94 258" stroke-dashoffset="-218"/>
    <circle cx="128" cy="684" r="56" fill="none" stroke="#b5622f" stroke-width="24" stroke-dasharray="28 324" stroke-dashoffset="-316"/>
  </g>
  <text x="128" y="682" fill="#e6e4dc" font-size="19" font-weight="600" text-anchor="middle">48.2k</text>
  <text x="128" y="698" fill="#98a29a" font-size="10" text-anchor="middle">tCO₂e</text>
  <g font-size="12">
    <circle cx="228" cy="650" r="5" fill="#8a9c28"/><text x="240" y="654" fill="#e6e4dc">Scope 3 — food &amp; goods</text><text x="240" y="670" fill="#98a29a">61%</text>
    <circle cx="228" cy="692" r="5" fill="#3a86c8"/><text x="240" y="696" fill="#e6e4dc">Scope 2 — electricity</text><text x="240" y="712" fill="#98a29a">27%</text>
    <circle cx="228" cy="734" r="5" fill="#b5622f"/><text x="240" y="738" fill="#e6e4dc">Scope 1 — gas &amp; fleet</text><text x="240" y="754" fill="#98a29a">12%</text>
  </g>

  <!-- top sites -->
  <rect x="428" y="564" width="820" height="204" rx="12" fill="#242a26" stroke="#2c332e"/>
  <text x="452" y="598" fill="#e6e4dc" font-size="14" font-weight="600">Top sites by emissions <tspan fill="#98a29a" font-weight="400">· tCO₂e</tspan></text>
  <g font-size="12" fill="#e6e4dc">
    <text x="452" y="633">Club — Greater London</text>
    <text x="452" y="668">Hotel — Manchester</text>
    <text x="452" y="703">Club — Birmingham</text>
    <text x="452" y="738">Hotel — Leeds</text>
  </g>
  <!-- bars: start x=650, max width 480 at 1.9k -->
  <g>
    <path d="M650,622 L1126,622 Q1130,622 1130,626 L1130,632 Q1130,636 1126,636 L650,636 Z" fill="#8a9c28"/>
    <path d="M650,657 L1076,657 Q1080,657 1080,661 L1080,667 Q1080,671 1076,671 L650,671 Z" fill="#8a9c28"/>
    <path d="M650,692 L1026,692 Q1030,692 1030,696 L1030,702 Q1030,706 1026,706 L650,706 Z" fill="#8a9c28"/>
    <path d="M650,727 L996,727 Q1000,727 1000,731 L1000,737 Q1000,741 996,741 L650,741 Z" fill="#8a9c28"/>
  </g>
  <g font-size="11" fill="#98a29a">
    <text x="1140" y="633">1,920</text>
    <text x="1090" y="668">1,720</text>
    <text x="1040" y="703">1,520</text>
    <text x="1010" y="738">1,400</text>
  </g>
</svg>
